<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Up Streamline Properties</title><link rel="stylesheet" href="/assets/css/site.css?v=22"><link rel="icon" href="/assets/img/favicon.ico"></head><body><header class="site-header"><div class="container"><div class="header-row"><a class="brand brand-full" href="/"><img src="/assets/img/streamline-systems-logo.png" alt="Streamline Systems"></a><div class="header-actions"><a class="btn btn-light" href="/account/">Back to Account</a></div></div></div></header><main class="account-login-shell"><div class="account-login-card"><div class="overline">Properties Owner Setup</div><h1>Create your Properties login</h1><p class="muted">Your Streamline customer account is being used only to verify ownership. The new email/password below becomes your separate Properties owner account.</p><form id="properties-setup-form" class="account-login-form"><label>Your name<input name="displayName" required></label><label>Properties login email<input name="email" type="email" autocomplete="email" required></label><label>Create password<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><div data-status class="account-form-status"></div><button class="btn btn-primary" type="submit">Create Properties Owner Account</button></form></div></main><script src="/assets/js/site.js?v=22"></script><script src="/assets/js/properties-auth.js?v=22"></script></body></html>
