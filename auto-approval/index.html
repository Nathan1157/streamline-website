<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Review Vehicle Authorization | Streamline Auto</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#102f40;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}.wrap{max-width:760px;margin:0 auto;padding:20px 14px 48px}.card{background:#fff;border:1px solid #b9c8cf}.head{background:#0d3448;color:#fff;padding:18px}.head small{font-weight:800;letter-spacing:.08em}.head h1{font-size:24px;margin:5px 0}.head p{margin:0;color:#dbe8ee}.section{padding:16px;border-top:1px solid #d7e0e4}.money{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #d7e0e4}.money div{padding:14px;border-right:1px solid #d7e0e4}.money div:last-child{border:0}.money small{display:block;color:#667b85;font-weight:800}.money b{display:block;font-size:23px;margin-top:3px}.money .new b{color:#173e53}.changes{margin:0;padding:0;list-style:none}.changes li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e3eaed}.shop-message{margin:0 0 14px;padding:14px 16px;border-left:4px solid #2457d6;background:#f3f7ff}.shop-message small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;color:#5f7180;margin-bottom:5px}.shop-message p{margin:0;font-size:14px;line-height:1.55;color:#1e2d34}.notice{background:#fff8df;border-left:4px solid #c59700;padding:12px;font-size:13px;line-height:1.45}.legal{font-size:12px;line-height:1.5;color:#435861}.legal details{border-top:1px solid #d9e2e6;padding:10px 0}.legal summary{font-weight:800;color:#173e53;cursor:pointer}.sign label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}.sign input[type=text]{width:100%;padding:12px;border:1px solid #9eafb7;font-size:16px}.canvas-wrap{border:1px solid #8197a1;background:#fff}.canvas-wrap canvas{width:100%;height:170px;display:block;touch-action:none}.canvas-actions{display:flex;justify-content:flex-end}.canvas-actions button{border:0;background:transparent;color:#24546b;padding:8px}.agree{display:flex!important;gap:10px;align-items:flex-start;font-weight:600!important;line-height:1.4}.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:16px}.actions button{padding:14px;border:1px solid #173e53;font-weight:900;font-size:14px}.reject{background:#fff;color:#8f241f;border-color:#8f241f!important}.accept{background:#173e53;color:#fff}.actions button:disabled{opacity:.5}.status{padding:24px;text-align:center}.status h2{margin:4px 0}.muted{color:#647883;font-size:12px}.brand{padding:12px;text-align:center;color:#6a7b84;font-size:11px}@media(max-width:560px){.money{grid-template-columns:1fr}.money div{border-right:0;border-bottom:1px solid #d7e0e4}.actions{grid-template-columns:1fr}.head h1{font-size:21px}}
</style></head><body><main class="wrap"><div class="card" id="app"><div class="status"><h2>Loading authorization…</h2><p class="muted">Please wait.</p></div></div><div class="brand">Powered by Streamline Auto · Streamline Systems</div></main><script>
(()=>{const API='https://api.streamlinebusinessos.com/api/v1/public/auto';const params=new URLSearchParams(location.search),token=params.get('token')||'';const app=document.getElementById('app');let rec=null,strokes=[],drawing=false,current=[];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function status(title,text){app.innerHTML=`<div class="status"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`}
async function load(){if(!token)return status('Invalid authorization link','This link is missing its authorization token.');try{const r=await fetch(`${API}/authorizations/${encodeURIComponent(token)}`,{headers:{accept:'application/json'}}),b=await r.json();if(!r.ok||!b.ok)throw new Error(b?.error?.message||b?.message||'Authorization could not be loaded.');rec=b.authorization;render()}catch(e){status('Unable to load request',e.message)}}
function render(){if(['accepted','manual_approved'].includes(rec.status))return status('Authorization accepted','This request has already been approved. You may close this page.');if(rec.status==='rejected')return status('Request declined','This request has already been declined. Contact the repair shop if you need to make a change.');if(rec.status==='expired'||rec.status==='superseded')return status('Request is no longer active','Contact the repair shop for a new authorization request.');app.innerHTML=`<div class="head"><small>VEHICLE AUTHORIZATION REQUEST</small><h1>${esc(rec.shopName)}</h1><p>${esc(rec.vehicleLabel||'Vehicle')}</p></div><div class="money"><div><small>PREVIOUSLY APPROVED</small><b>${money(rec.previousTotal)}</b></div><div><small>CHANGE</small><b>${rec.deltaTotal>=0?'+':''}${money(rec.deltaTotal)}</b></div><div class="new"><small>NEW TOTAL IF ACCEPTED</small><b>${money(rec.newTotal)}</b></div></div>${rec.shopMessage?`<div class="section"><div class="shop-message"><small>MESSAGE FROM THE SHOP</small><p>${esc(rec.shopMessage)}</p></div></div>`:''}<div class="section"><h3>Requested changes</h3><ul class="changes">${(rec.changeSummary||[]).map(x=>`<li><span>${esc(x.label)}</span><b>${x.amount==null?'':money(x.amount)}</b></li>`).join('')||'<li><span>See the repair shop for itemized details.</span></li>'}</ul></div><div class="section"><div class="notice"><b>Approval is optional.</b> Accepting authorizes the requested change and new total shown above. Rejecting does not approve the requested change. Your previously authorized work is not automatically canceled by rejecting this change.</div></div><div class="section legal"><h3>Authorization & platform notices</h3><details open><summary>Repair authorization</summary><p>By accepting, you represent that you are the vehicle owner or are otherwise authorized to approve work on the vehicle. You authorize the repair shop identified above to perform the requested work shown on this page up to the new authorized total. This authorization applies only to the request shown here and does not authorize unrelated future work or charges.</p><p>Repair estimates may involve diagnosis and conditions that cannot be fully known before disassembly or testing. If the shop identifies additional work or charges beyond this authorization, a new authorization should be obtained unless applicable law permits otherwise.</p></details><details><summary>Electronic signature and records</summary><p>By selecting Accept, entering your name, providing a signature, and checking the consent box, you intend your electronic action to serve as your signature and authorization. You consent to receive and retain this authorization electronically. You may reject the request instead of signing electronically and may contact the shop to ask about another available method.</p><p>For recordkeeping, the system may retain the date and time, signature method, entered name, authorization contents, browser/user-agent information, and network address associated with the response. These records may be used to document the authorization transaction.</p></details><details><summary>Repair shop responsibility</summary><p>The repair shop is an independent business and is solely responsible for its diagnosis, repair recommendations, pricing, taxes and fees, parts selection, installation, workmanship, warranties, vehicle custody, disclosures, and compliance with automotive-repair and consumer-protection requirements applicable to the shop.</p><p>Questions about the repair, parts, warranty, estimate, or charges should be directed to the repair shop before accepting.</p></details><details><summary>Streamline Systems platform limitation</summary><p>Streamline HQ LLC, operating as Streamline Systems, provides software used to transmit and record this authorization. Streamline Systems is not the repair facility, does not inspect or repair the vehicle, does not select parts, does not set the shop's prices, and does not warrant the shop's services or parts. The software may contain incomplete, delayed, or inaccurate fitment, pricing, inventory, or vehicle information; the shop remains responsible for verifying those details.</p><p>This page does not create a repair warranty from Streamline Systems, does not process a payment by itself, and does not authorize a charge to a card or bank account unless a separate payment authorization expressly says so.</p></details><details><summary>Consumer rights and shop terms</summary><p>Nothing on this page is intended to waive rights that cannot legally be waived. The shop's own repair order, posted policies, warranty terms, and legally required disclosures may also apply. If any platform notice conflicts with mandatory law, mandatory law controls. Streamline Systems does not provide legal advice to the customer or repair shop, and shops should have their own authorization language reviewed for their jurisdiction.</p></details><details><summary>Electronic communications</summary><p>Email and internet communications can be delayed, misdirected, or accessed by someone with access to the recipient's email or device. If you did not request service for this vehicle or are not authorized to respond, do not accept and contact the repair shop.</p></details></div><div class="section sign"><h3>Sign and respond</h3><label>FULL NAME</label><input id="name" type="text" autocomplete="name" placeholder="Your full legal name"><label>DRAW SIGNATURE <span class="muted">(mouse, touch, or pen)</span></label><div class="canvas-wrap"><canvas id="sig" width="700" height="170"></canvas><div class="canvas-actions"><button id="clear" type="button">CLEAR SIGNATURE</button></div></div><label class="agree"><input id="consent" type="checkbox"> <span>I have reviewed the requested changes, totals, and notices above. I am authorized to respond for this vehicle and I intend this electronic response to be binding evidence of my decision.</span></label><div class="actions"><button class="reject" id="reject" type="button">REJECT REQUEST</button><button class="accept" id="accept" type="button">ACCEPT & SIGN</button></div><p class="muted">If you do not want to use the drawn signature field, you may still type your full name and accept; the typed name will be recorded as the electronic signature method.</p></div>`;wireCanvas();document.getElementById('reject').onclick=()=>decide('reject');document.getElementById('accept').onclick=()=>decide('accept')}
function wireCanvas(){const c=document.getElementById('sig'),ctx=c.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#102f40';const point=e=>{const r=c.getBoundingClientRect();return {x:Math.round((e.clientX-r.left)*c.width/r.width),y:Math.round((e.clientY-r.top)*c.height/r.height)}};c.addEventListener('pointerdown',e=>{drawing=true;current=[point(e)];strokes.push(current);c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e),last=current[current.length-1];current.push(p);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke()});const stop=()=>drawing=false;c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);document.getElementById('clear').onclick=()=>{strokes=[];ctx.clearRect(0,0,c.width,c.height)}}
async function decide(decision){const name=document.getElementById('name').value.trim(),consent=document.getElementById('consent').checked;if(decision==='accept'&&(!name||!consent))return alert('Enter your full name and check the authorization consent box before accepting.');const buttons=[document.getElementById('accept'),document.getElementById('reject')];buttons.forEach(b=>b.disabled=true);try{const body={decision,signedName:name||null,signatureMethod:decision==='accept'?(strokes.length?'draw':'typed'):'none',signatureData:strokes.length?{strokes}:null,consentAccepted:decision==='accept'?consent:false};const r=await fetch(`${API}/authorizations/${encodeURIComponent(token)}/decision`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(body)}),b=await r.json();if(!r.ok||!b.ok)throw new Error(b?.error?.message||b?.message||'Response could not be saved.');status(decision==='accept'?'Authorization accepted':'Request declined',decision==='accept'?'Your authorization was recorded. The repair shop can now see your response.':'Your rejection was recorded. Contact the repair shop if you want to discuss the requested work.')}catch(e){buttons.forEach(b=>b.disabled=false);alert(e.message)}}
load()})();
</script></body></html>
