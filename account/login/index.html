<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Streamline Systems</title><meta name="description" content="Sign in to your Streamline customer account."><link rel="stylesheet" href="/assets/css/site.css?v=25"><link rel="icon" href="/assets/img/favicon.ico"><meta name="theme-color" content="#18201e"><script>document.documentElement.classList.add('js')</script></head><body data-page="account"><header class="site-header"><div class="container"><div class="header-row"><a class="brand brand-full" href="/"><img src="/assets/img/streamline-systems-logo.png" alt="Streamline Systems"></a><div class="header-actions"><a class="btn btn-light" href="/">Back to website</a></div></div></div></header><main class="account-shell"><section class="account-login-wrap"><div class="account-login-card"><div class="overline">Customer Account</div><h1>Sign in</h1><p class="lede">Use the email and password connected to your Streamline account.</p><form id="account-login-form" class="account-form"><div class="account-step" data-login-step="credentials"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><div class="account-login-links"><span></span><a href="/account/forgot/">Forgot password?</a></div><button class="btn btn-primary" type="submit">Continue</button></div><div class="account-step" data-login-step="verify" hidden><p class="muted" data-login-code-copy>We sent a 6-digit verification code to your email.</p><label>Email verification code<input type="text" name="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}"></label><label data-authenticator-field hidden>Authenticator app code<input type="text" name="authenticatorCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}"></label><button class="btn btn-primary" type="submit">Verify and sign in</button><button class="btn btn-light" type="button" data-login-back>Use a different login</button></div><p class="account-form-status" data-status></p></form></div></section></main><script src="/assets/js/site.js?v=25"></script><script src="/assets/js/account.js?v=25"></script></body></html>
